name: Update VigilXplr Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run data updater (1978→present incremental)
        run: python scripts/update_data.py
        env:
          NTSB_SUBSCRIPTION_KEY: ${{ secrets.NTSB_SUBSCRIPTION_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "VigilXplr Bot"
          git config user.email "bot@vigilxplr.local"
          git add data/events.json data/pull_progress.json || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): NTSB historical backfill $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
