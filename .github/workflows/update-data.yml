name: Update VigilXplr Data

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests httpx beautifulsoup4 lxml

      - name: Run data updater
        run: python scripts/update_data.py
        env:
          # Optional: if you later obtain an NTSB developer portal subscription key
          NTSB_SUBSCRIPTION_KEY: ${{ secrets.NTSB_SUBSCRIPTION_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "VigilXplr Bot"
          git config user.email "bot@vigilxplr.local"
          git add data/events.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): hourly NTSB/FRA refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
